<style>
:root{--bg1:#0b1e4f;--bg2:#1b3a8f;--card:#ffffff;--ink:#14224d;--star:#ffd23f;--cy:#22d3ee;--pu:#8b5cf6;--ok:#16a34a;--no:#e11d48}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:18px;color:#fff;background:radial-gradient(circle at 20% 10%,#2a4fc0 0,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 120px 90px,#cdeaff,transparent),radial-gradient(1.5px 1.5px at 220px 50px,#fff,transparent);background-size:260px 160px;opacity:.7}
#app{position:relative;max-width:900px;margin:0 auto;padding:14px}
h1,h2,h3{margin:.3em 0}
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:16px;padding:12px 18px;min-height:48px;background:var(--star);color:#3b2a00;cursor:pointer;box-shadow:0 4px 0 #c79a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c79a00}
.btn.sec{background:var(--cy);color:#04323b;box-shadow:0 4px 0 #0e8aa0}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--pu);outline-offset:2px}
input{font:inherit;width:100%;padding:12px;border-radius:14px;border:3px solid #c7d2fe;margin:6px 0;color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pts{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.planet{border:0;border-radius:24px;padding:14px 8px;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .2s}
.planet:hover{transform:translateY(-4px) rotate(-1deg)}
.planet .e{font-size:2.6rem;display:block;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.hero{text-align:center;padding-top:20px}
.hero svg{width:170px;animation:fl 3s ease-in-out infinite}
.warn{background:#fff7d6;color:#5a4300;border-radius:14px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:#eef2ff;color:var(--ink);box-shadow:0 3px 0 #c7d2fe}
.opt.good{background:#bbf7d0}.opt.bad{background:#fecdd3}
.fb{border-radius:14px;padding:12px;margin-top:10px}
.fb.ok{background:#dcfce7}.fb.no{background:#ffe4e6}
.chip{display:inline-block;background:#e0e7ff;border-radius:999px;padding:3px 12px;margin:3px;font-size:.9rem}
.jv{font-family:'Noto Sans Javanese',serif;font-size:2rem}
.bar{height:12px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.av{display:inline-block;font-size:2.2rem}.av.talk{animation:tk .35s infinite alternate}@keyframes tk{to{transform:scale(1.18) rotate(6deg)}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tabs .btn{flex:0 0 auto;min-height:40px;padding:6px 14px}select{font:inherit;width:100%;padding:10px;border-radius:14px;border:3px solid #c7d2fe;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

return`${topBar("home")}<div class="card"><h2>${V.own?"👕 Lemari & Koleksi":"🛍️ Toko Kostum & Roket"}</h2><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="width:120px">${astro(pv)}</div><div style="width:50px">${rocket(IM[pv.rocket][4])}</div><div><p>Stardust: <b>⭐ ${D.pts}</b></p>${V.msg?`<p style="color:#b45309"><b>${esc(V.msg)}</b></p>`:"<p>Tekan 👁️ Lihat untuk mencoba barang.</p>"}</div></div>
<label style="font-size:.9rem"><input type="checkbox" data-a="own" ${V.own?"checked":""} style="width:auto"> Hanya milikku</label></div>
<div class="tabs">${SLOTS.map(([k,l])=>`<button class="btn ${k===tab?"":"sec"}" data-a="tab" data-i="${k}">${l}</button>`).join("")}</div>
<div class="grid">${items.map(i=>{const id=i[0],ow=owned(id),on=E[i[1]]===id&&i[1]!=="set",pr=i[1]==="rocket"?rocket(i[4]):astro(i[1]==="set"?Object.assign({},DEF,E,i[5]):Object.assign({},E,{[i[1]]:id}));return`<div class="card" style="text-align:center;margin:0"><div style="width:70px;margin:auto">${pr}</div><b>${i[2]}</b><br>${i[3]?`⭐ ${i[3]}`:"Gratis"}<br><button class="btn ghost" style="color:#14224d;background:#e5e7eb;min-height:36px" data-a="pv" data-id="${id}">👁️ Lihat</button><br>${ow?`<button class="btn sec" data-a="wear" data-id="${id}" ${on?"disabled":""}>${on?"Dipakai ✓":"Pakai"}</button>`:`<button class="btn" data-a="buy" data-id="${id}">Beli</button>`}</div>`}).join("")}</div>`},
set:()=>`${topBar("home")}<div class="card"><h2>🔊 Pengaturan Suara</h2>${[["m","🎵 Musik latar"],["s","🔔 Efek suara"],["t","🗣️ Suara guru"],["v","🔈 Volume utama"]].map(([k,l])=>`<label>${l}<input type="range" min="0" max="1" step=".05" value="${AU.set[k]}" data-s="${k}"></label>`).join("")}<label><input type="checkbox" data-s="mute" ${AU.set.mute?"checked":""} style="width:auto"> 🔇 Bisukan semua</label><p><button class="btn sec" data-a="test">Tes suara</button></p>

${S.map(s=>{const o=(AU.set.vp||{})[s.id]||{},dv=VP[s.id],vs=TTS?speechSynthesis.getVoices().filter(v=>/^(id|en|jv|ms)/i.test(v.lang)):[];return`<div class="card" style="background:#f1f5f9"><b>${s.e} ${s.t}</b>

book:()=>{return`${topBar("home")}<div class="card"><div style="width:90px">${astro(eq())}</div><h2>📖 Buku Perjalanan ${esc(U)}</h2>${S.map(s=>`<p>${s.e} ${s.n}<div class="bar"><i style="width:${pct(s)}%"></i></div></p>`).join("")}
<h3>Riwayat poin</h3>${D.log.slice(-8).reverse().map(l=>`<div>⭐ ${l[1]>0?"+":""}${l[1]} — ${esc(l[0])}</div>`).join("")||"<p>Belum ada. Ayo mulai belajar!</p>"}</div>`}
};

/* ===== AKSI ===== */
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const d=b.dataset;if(!AU.on){au();startMusic()}sfx("click");
 if(d.a==="go")return go(d.v,{i:d.i,c:d.c===undefined?undefined:+d.c,own:!!d.own,tab:d.tab});
 if(d.a==="say")return say(d.t,d.sid,d.l);if(d.a==="stop")return stop();
 if(d.a==="tab"){V.tab=d.i;V.pv=null;V.msg="";return draw()}
 if(d.a==="own"){V.own=!V.own;return draw()}
 if(d.a==="pv"){const i=IM[d.id];V.pv=i[1]==="set"?i[5]:{[i[1]]:d.id};V.msg="";return draw()}
 if(d.a==="wear"){wear(d.id);V.pv=null;return draw()}
 if(d.a==="buy"){const i=IM[d.id];ensure();if(owned(d.id))return;if(D.pts<i[3]){V.msg="Stardust belum cukup. Kurang "+(i[3]-D.pts)+" lagi, ayo kumpulkan dari soal!";sfx("no");return draw()}if(!confirm("Beli "+i[2]+" seharga "+i[3]+" Stardust?"))return;award(-i[3],"Beli "+i[2]);D.inv.push(d.id);wear(d.id);V.pv=null;V.msg="Yeay! "+i[2]+" jadi milikmu!";sfx("reward");return draw()}
 if(d.a==="tv"){return say("Halo "+U+"! Ini suara "+sub(d.i).t+". Gimana, cocok nggak?",d.i,d.i==="ing"?"en-US":"id-ID")}
 if(d.a==="vreset"){AU.set.vp={};persistAu();return draw()}if(d.a==="mute"){AU.set.mute=!AU.set.mute;if(AU.set.mute)stop();applyAu();persistAu();return draw()}if(d.a==="test"){say("Halo! Ini suara guru. Kalau kamu dengar aku, berarti suaranya sudah jalan!",V.i||"mat","id-ID");return sfx("ok")}
 if(d.a==="login"||d.a==="reg"){const er=await auth($("#nm").value,$("#pn").value,d.a==="reg");if(er){$("#er").textContent=er;return}if(D.audio)Object.assign(AU.set,D.audio);ensure();applyAu();return go("home")}
 if(d.a==="out"){U=D=null;return go("intro")}
 if(d.a==="done"){const k=d.i+d.c;if(!D.mat[k]){D.mat[k]=1;award(10,"Selesai materi");sfx("reward")}return go("chap",{i:d.i,c:+d.c})}
 if(d.a==="quiz"){const c=+d.c,l=Q.filter(q=>q.s===d.i&&(c<0||q.c===c));QS={l,k:0,ord:{},got:0,fb:{}};return go("quiz")}
 if(d.a==="ans"){const q=QS.l[QS.k];if(D.ans[q.id])return;const ok=+d.i===q.a;D.ans[q.id]={ok,pick:+d.i};const p=ok?10:3;QS.got+=p;award(p,ok?"Jawaban benar":"Jawaban salah");const ln=pick(T[q.s][ok?0:1]).replace("{n}",U);QS.fb[q.id]=ln;sfx(ok?"ok":"no");draw();return say(ln,q.s,"id-ID")}
 if(d.a==="next"){stop();QS.k++;if(!QS.l[QS.k])sfx("win");return draw()}
});
document.addEventListener("input",e=>{const vp=e.target.dataset&&e.target.dataset.vp;if(vp){const[sid,fl]=vp.split(".");AU.set.vp=AU.set.vp||{};AU.set.vp[sid]=AU.set.vp[sid]||{};if(fl==="v"){if(e.target.value)AU.set.vp[sid].v=e.target.value;else delete AU.set.vp[sid].v}else AU.set.vp[sid][fl]=+e.target.value;persistAu();return}const k=e.target.dataset&&e.target.dataset.s;if(!k)return;AU.set[k]=k==="mute"?e.target.checked:+e.target.value;applyAu();persistAu()});
if(TTS)speechSynthesis.onvoiceschanged=()=>{if(V.v==="set")draw()};
draw();
